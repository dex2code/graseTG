# Настройки поведения бота. Секреты хранятся отдельно — в .env (см. .env.example).

# ID групповых чатов, в которых бот отвечает. Всё остальное игнорируется.
# Как узнать id — см. README, раздел «Как узнать ID группы».
allowed_chat_ids: []
#  - -1001234567890
#  - -1009876543210

# Параметры обращения к LLM (OpenAI-совместимый backend; адрес и ключ — в .env)
llm:
  model: gpt-5-mini        # поменяй на имя модели твоего backend'а
  temperature: 0.7
  max_tokens: 1024
  timeout_seconds: 60

# Системный промпт: характер и правила ответов. Замени на свой.
system_prompt: |
  Ты — ассистент в семейном групповом чате. Отвечай по-русски: кратко, ясно и по делу.
