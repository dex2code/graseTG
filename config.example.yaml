# Bot behavior settings. Copy this file to config.yaml (gitignored) and adjust.
# Secrets are kept separately in .env (see .env.example).
# Unknown keys are rejected at startup: a typo fails fast instead of silently
# disabling a setting.

# IDs of group chats where the bot answers. Everything else is ignored.
# To find a chat id, see the "How to find a group ID" section in README.
allowed_chat_ids: []
#  - -1001234567890
#  - -1009876543210

# LLM call parameters (OpenAI-compatible backend; URL and key live in .env)
llm:
  model: gpt-5-mini        # change to your backend's model name
  temperature: 0.7         # creativity: 0 = deterministic, higher = more varied
  # Sampling overrides (optional, standard OpenAI fields — vanilla-API safe).
  # Unset = the field is not sent at all and the backend applies its default.
  # top_p: 0.9             # nucleus sampling cutoff, (0, 1]
  # presence_penalty: 0.0  # penalize tokens that already appeared, [-2, 2]
  max_tokens: 1024         # upper bound for a single answer, in tokens
  timeout_seconds: 60      # give up on a slow model after this
  # Max tool-call rounds per question (tools live in the `tools:` section
  # below). Must be 1 or more: 0 would mean "advertise tools but never run
  # them". Tools on/off is decided solely by the presence of tools.mcp.
  tool_rounds: 2
  # Model "thinking" toggle, sent as chat_template_kwargs (vLLM/SGLang, Qwen3-style):
  #   true / false — send the field with this value
  #   null         — do not send the field at all (safest for plain OpenAI APIs)
  enable_thinking: null

# System prompt: answer style and rules. Replace with your own.
system_prompt: |
  You are an assistant in a family group chat. Answer in User's language: briefly, clearly and to the point.

# User-facing texts of the bot. Defaults are English — translate them to your
# language here. Every value must be non-empty; unknown keys are rejected.
# format_hint is a template: {username} is replaced with the bot's @username
# (unknown placeholders fail at startup).
messages:
  ack: "Got it, thinking…"
  error: "Failed to get a response from the model. Please try again later."
  tool_failure: "I couldn't fetch the external data needed to answer this. Please try again later."
  format_hint: |
    To ask a question, write it in the same message after the mention:
    "@{username} how do I cook borscht?"
    Or simply reply to any of my messages.
  media_stub: "I can see the attachment, but I can't analyze it yet — ask about it with text."
  audio_stub: "Voice and audio messages are not supported yet — please type your question."
  sticker_stub: "Nice sticker! I can't reply to stickers meaningfully yet."
  other_stub: "This message type is not supported yet — ask me with a text @mention."
  empty_answer: "The model returned an empty response."

# External tools the model may call. The section is optional: absent ->
# requests carry no `tools` field and the bot behaves as before.
# Architecture (docs/mcp-tools-spec.md): exactly ONE MCP server, streamable
# HTTP. Requires llama-server built with tool calling (run it with --jinja)
# and a model that supports tool calls (Qwen3, Llama 3.x, ...).
# A token, if the server needs one, never lives here: auth_env NAMES a
# variable in .env (see .env.example).
# tools:
#   mcp:
#     url: "http://home-server:8080/mcp"
#     # auth_env: MCP_TOKEN
#     timeout_seconds: 30            # per tool call
#     # allow:                       # whitelist; default: every tool the server exposes
#     #   - get_weather_forecast
