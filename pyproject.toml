[project]
name = "grase-tg"
version = "0.1.0"
description = "Family Telegram bot: answers @mentions in whitelisted group chats via an OpenAI-compatible LLM API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "dex2code", email = "dex2code@local" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.32.0,<4",
    "aiohttp-socks>=0.12.0,<0.13",
    "openai>=3.52.0,<4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
grase-tg = "grase_tg:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
