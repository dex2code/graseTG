name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (Python 3.14 from .python-version)
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Type check
        run: uv run pyright src tests
